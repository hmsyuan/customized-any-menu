<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多人線上點菜</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <div class="title-row">
        <h1>多人線上點菜（最多 10 人）</h1>
        <label class="theme-picker">背景色
          <input type="color" id="theme-color" value="#0b1020" />
        </label>
      </div>

      <section class="card glass">
        <h2>1) 先取名</h2>
        <form id="join-form" class="inline-form">
          <input id="name" placeholder="輸入你的名稱" required />
          <button type="submit">加入</button>
        </form>
        <p id="whoami"></p>
        <div id="host-panel"></div>
      </section>

      <section class="card">
        <h2>2) 匯入菜單（主持人操作）</h2>
        <div class="upload-grid">
          <form id="json-menu-form" class="inline-form">
            <label>JSON 菜單：</label>
            <input type="file" id="json-file" accept="application/json" required />
            <button id="json-submit-btn" type="submit">匯入 JSON</button>
          </form>

          <form id="image-menu-form" class="inline-form">
            <label>圖片菜單：</label>
            <input type="file" id="image-file" accept="image/*" required />
            <button id="image-submit-btn" type="submit">匯入圖片</button>
          </form>
        </div>
      </section>

      <section class="card">
        <h2>3) 點餐</h2>
        <div id="menu-view"></div>
      </section>

      <section class="card">
        <h2>即時點餐總覽</h2>
        <div id="summary"></div>
      </section>

      <section class="card">
        <h2>完整彙整點餐結果（不分點餐人）</h2>
        <div id="aggregate-summary"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
